name: Create tag

on:
  workflow_dispatch:
    inputs:
      new_version:
        type: string
        description: 'The new version number (e.g. `5.5.2`)'
        required: true

jobs:
  create_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
        TAG_NAME: ${{ steps.tag-name.outputs.TAG_NAME }}
    env:
        NEW_VERSION: ${{ inputs.new_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Get current project version
        run: |
          echo "MC_VERSION=$(awk -F= '/^ARG MC_VERSION=/{print $2}' "Dockerfile" | tr -d '"')" >> ${GITHUB_ENV}

      - uses: hazelcast/docker-actions/get-tag-name@master
        id: tag-name
        with:
          VERSION: ${{ env.MC_VERSION }}

      - uses: hazelcast/docker-actions/create-tag@master
        with:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          TAG_NAME: ${{ steps.tag-name.outputs.TAG_NAME }}

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Update the Dockerfile with the new version
        run: |
          sed --in-place 's/^ARG MC_VERSION=.*/ARG MC_VERSION=${NEW_VERSION}/' Dockerfile

      - name: Commit and push changes
        run: |
          git commit --all -m ${NEW_VERSION}
          git push

  build:
    needs: create_tag
    uses: $/.github/workflows/tag_image_push.yml
    with:
      dry-run: false
      tag: ${{ needs.create_tag.outputs.TAG_NAME }}
    permissions:
      id-token: write
    secrets: inherit
